<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e0e1a" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g stroke="rgba(0, 240, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Radar circles -->
  <circle cx="600" cy="270" r="180" fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="2" />
  <circle cx="600" cy="270" r="100" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="1.5" />
  <circle cx="600" cy="270" r="40" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="2" />

  <!-- Logo Mark -->
  <rect x="560" y="230" width="80" height="80" rx="24" fill="url(#neon)" filter="url(#glow)" />
  <path d="M600 248 L588 274 L598 274 L596 292 L612 266 L602 266 Z" fill="#ffffff" />

  <!-- Title -->
  <text x="600" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">NEONTRACE</text>
  
  <!-- Subtitle -->
  <text x="600" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="middle">Your people. Your places. Your world — live.</text>

  <!-- Badges -->
  <text x="600" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#00f0ff" text-anchor="middle" letter-spacing="2">PRIVACY-FIRST LIVE LOCATION SHARING</text>
</svg>